# -----------------------------------------------------------------------------
# Resume Builder - HOST nginx site.
# deploy/deploy.sh renders this file into /etc/nginx/sites-available/resume-builder and symlinks it
# into sites-enabled. Placeholders (filled by deploy.sh):
#   __SERVER_NAME__     --domain value, or "_" when no domain is set
#   __DEFAULT_SERVER__  " default_server" when this site should answer requests by IP, else empty
#   __FRONTEND__        frontend container, published on 127.0.0.1 (default 127.0.0.1:3000)
#   __BACKEND__         backend container, published on 127.0.0.1 (default 127.0.0.1:4000)
# With --domain/--email, certbot's nginx plugin adds the "listen 443 ssl" lines and the HTTP->HTTPS
# redirect to this file ("# managed by Certbot"); deploy.sh re-applies them on every run.
# Everything is prefixed rb_ so it cannot clash with other sites on this server.
# -----------------------------------------------------------------------------

upstream rb_frontend {
    server __FRONTEND__;
    keepalive 16;
}

upstream rb_backend {
    server __BACKEND__;
    keepalive 16;
}

# WebSocket / upgrade support; an empty Connection header keeps upstream keepalive working.
map $http_upgrade $rb_connection_upgrade {
    default upgrade;
    ''      '';
}

# The app's Content-Security-Policy contains "upgrade-insecure-requests". Over plain HTTP that makes
# browsers fetch every script/style over https:// (which does not exist yet), so on http only that
# directive is dropped. Over https the policy passes through unchanged.
map $upstream_http_content_security_policy $rb_csp_noupgrade {
    "~^(?<rb_csp_a>.*?);\s*upgrade-insecure-requests(?<rb_csp_b>.*)$" "$rb_csp_a$rb_csp_b";
    default $upstream_http_content_security_policy;
}
map $scheme $rb_csp {
    https   $upstream_http_content_security_policy;
    default $rb_csp_noupgrade;
}

server {
    listen 80__DEFAULT_SERVER__;
    server_name __SERVER_NAME__;
    server_tokens off;

    # Audio uploads are up to 100 MB (+ multipart overhead).
    client_max_body_size 110m;
    client_body_timeout  3600s;
    send_timeout         3600s;

    # gzip (the distro nginx.conf may already say "gzip on"; repeating it here is allowed).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml application/manifest+json image/svg+xml font/ttf font/otf;

    # Proxy defaults (inherited by every location below).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;   # edge proxy: overwrite, do not trust client values
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $rb_connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Security headers: upstream copies are hidden so each header is sent exactly once.
    # HSTS comes from the Next.js app itself.
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    add_header X-Frame-Options         "DENY" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $rb_csp always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Audio tool: stream uploads to the API and previews/downloads back (Range/ETag); 1 h timeouts.
    location /rb-api/audio/ {
        proxy_pass http://rb_backend/audio/;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        error_page 502 503 504 = @rb_api_unavailable;
    }

    # API: /rb-api/<path> -> backend /<path>
    location /rb-api/ {
        proxy_pass http://rb_backend/;
        error_page 502 503 504 = @rb_api_unavailable;
    }

    # Same JSON shape the app's own proxy returns when the API is down.
    location @rb_api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"The server is unavailable right now. Please try again shortly.","code":"UPSTREAM_UNAVAILABLE"}';
    }

    # Hashed Next.js build assets: cache for a year (add_header here replaces the server-level list,
    # so the security headers are repeated).
    location /_next/static/ {
        proxy_pass http://rb_frontend;
        proxy_hide_header Cache-Control;
        add_header Cache-Control           "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-Frame-Options         "DENY" always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    }

    # Everything else: the Next.js app.
    location / {
        proxy_pass http://rb_frontend;
    }
}
