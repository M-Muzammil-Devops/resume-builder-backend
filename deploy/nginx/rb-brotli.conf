# Installed to /etc/nginx/conf.d/rb-brotli.conf by deploy.sh when libnginx-mod-http-brotli-filter is available.
brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types text/plain text/css text/xml application/json application/javascript application/xml
             application/rss+xml application/manifest+json image/svg+xml font/ttf font/otf;
