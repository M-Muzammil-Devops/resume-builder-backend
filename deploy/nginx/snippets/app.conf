# Application routes (included inside the server that serves the site).

# Audio uploads are up to 100 MB (+ multipart overhead).
client_max_body_size 110m;
client_body_timeout  3600s;
send_timeout         3600s;

# Default upstream timeouts (the audio location raises them to 1 hour).
proxy_connect_timeout 10s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;

location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Audio tool: stream uploads straight to the API and stream previews/downloads back (Range/ETag).
location /rb-api/audio/ {
    proxy_pass http://rb_backend/audio/;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    error_page 502 503 504 = @api_unavailable;
}

# API: /rb-api/<path> -> backend /<path>
location /rb-api/ {
    proxy_pass http://rb_backend/;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    error_page 502 503 504 = @api_unavailable;
}

# Same JSON shape the app's own proxy returns when the API is down.
location @api_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"The server is unavailable right now. Please try again shortly.","code":"UPSTREAM_UNAVAILABLE"}';
}

# Hashed Next.js build assets: cache for a year.
location /_next/static/ {
    proxy_pass http://rb_frontend;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Everything else: the Next.js app.
location / {
    proxy_pass http://rb_frontend;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
}
