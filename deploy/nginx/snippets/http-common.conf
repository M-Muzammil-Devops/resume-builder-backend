# Shared http-level settings (included at the top of each server template).
server_tokens off;

# Docker's embedded DNS; "resolve" below re-resolves containers after they are recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream rb_frontend {
    zone rb_frontend 64k;
    server frontend:3000 resolve;
    keepalive 16;
}

upstream rb_backend {
    zone rb_backend 64k;
    server backend:4000 resolve;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml application/rss+xml application/manifest+json image/svg+xml font/ttf font/otf;

# The app's CSP contains "upgrade-insecure-requests". Over plain HTTP (no certificate yet, and the
# internal :8080 print endpoint used by the PDF renderer) that directive breaks every script/style, so
# this variant drops just that directive. Each template maps $rb_csp to the right variant.
map $upstream_http_content_security_policy $rb_csp_noupgrade {
    "~^(?<csp_a>.*?);\s*upgrade-insecure-requests(?<csp_b>.*)$" "$csp_a$csp_b";
    default $upstream_http_content_security_policy;
}
