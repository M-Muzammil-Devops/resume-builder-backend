# Security headers. Upstream copies are hidden so each header is sent exactly once.
# Content-Security-Policy (per-request nonce) and HSTS come from the Next.js app itself; the CSP is
# re-emitted through $rb_csp (defined per template) so plain-HTTP mode can drop upgrade-insecure-requests.
proxy_hide_header X-Powered-By;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;
add_header X-Frame-Options        "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy $rb_csp always;
