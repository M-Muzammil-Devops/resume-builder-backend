# -----------------------------------------------------------------------------
# Resume Builder - STAGING stack (used by deploy.sh)
#   HOST nginx (80/443, /etc/nginx/sites-available/resume-builder)
#     -> frontend (Next.js, this file)       127.0.0.1:${FRONTEND_PORT:-3000}
#     -> backend  (Fastify, HOST systemd service resume-builder-backend, NOT in this file)
#                                            127.0.0.1:${BACKEND_PORT:-4000}  (under /rb-api/)
#   postgres + redis (named volumes) are published on 127.0.0.1 only, for the host backend.
# The frontend uses the host network so it can reach the host backend on 127.0.0.1 (and nothing
# is exposed beyond loopback: it binds HOSTNAME=127.0.0.1).
# All values come from <backend>/.env (created by deploy.sh). Paths are relative to this file.
# (The backend Dockerfile stays in the repo for a future all-Docker production setup.)
# -----------------------------------------------------------------------------
name: resume-builder

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Small-server tuning (2 CPU / 3.8 GB host).
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
      - -c
      - work_mem=4MB
      - -c
      - effective_cache_size=512MB
      - -c
      - maintenance_work_mem=32MB
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in <backend>/.env}
      POSTGRES_DB: ${POSTGRES_DB:-resume_builder}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"     # loopback only (host backend)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in <backend>/.env}
    # Everything the app stores in Redis (cache + audio job state) is written with a TTL, so volatile-lru
    # evicts only expirable keys and never drops a key that has no expiry. 64 MB is far above real use.
    command: ["sh", "-c", "exec redis-server --appendonly yes --save 60 1000 --maxmemory 64mb --maxmemory-policy volatile-lru --requirepass \"$${REDIS_PASSWORD}\""]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.5
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"        # loopback only (host backend)
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  frontend:
    build:
      context: ${FRONTEND_DIR:-../../resume-builder-frontend}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:${BACKEND_PORT:-4000}
        NEXT_PUBLIC_SITE_URL: ${APP_URL}
    image: resume-builder-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 320m
    memswap_limit: 320m
    cpus: 1.0
    init: false                 # the image already runs tini
    network_mode: host          # reach the host backend on 127.0.0.1; listens on 127.0.0.1 only
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      HOSTNAME: 127.0.0.1
      PORT: ${FRONTEND_PORT:-3000}
      API_INTERNAL_URL: http://127.0.0.1:${BACKEND_PORT:-4000}
      API_URL: http://127.0.0.1:${BACKEND_PORT:-4000}
      NEXT_PUBLIC_SITE_URL: ${APP_URL:?APP_URL must be set in <backend>/.env}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *logging

volumes:
  pgdata:
  redisdata: