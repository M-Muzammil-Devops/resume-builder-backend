# -----------------------------------------------------------------------------
# Resume Builder - production stack (used by deploy.sh)
#   nginx (only public service: 80/443) -> frontend (Next.js :3000)
#                                        -> backend  (Fastify :4000, under /rb-api/)
#   backend -> postgres (named volume) + redis (named volume); neither is published.
# All values come from deploy/.env (created by deploy.sh). Paths are relative to this file.
# -----------------------------------------------------------------------------
name: resume-builder

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-resume_builder}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in deploy/.env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --save 60 1000 --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  backend:
    build:
      context: ${BACKEND_DIR:-..}
      dockerfile: Dockerfile
    image: resume-builder-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Everything in deploy/.env (JWT_SECRET, GEMINI_API_KEY, SMTP_*, AUDIO_* ...) reaches the API;
    # the keys below are fixed for the container network and win over the file.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-resume}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-resume_builder}?schema=public
      REDIS_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      APP_URL: ${APP_URL:?APP_URL must be set in deploy/.env}
      CORS_ORIGIN: ${APP_URL}
      FRONTEND_URL: ${APP_URL}
      # Puppeteer (PDF export) opens /print/:id through nginx's internal-only :8080 endpoint.
      PRINT_BASE_URL: http://nginx:8080
      UPLOAD_DIR: /app/uploads
      AUDIO_TMP_DIR: /app/tmp/audio
      FRONTEND_PUBLIC_DIR: /frontend/public
      RUN_MIGRATIONS: "true"
      # prisma/migrations does not yet cover all of schema.prisma; db push (non-destructive) fills the gap.
      PRISMA_SYNC_SCHEMA: ${PRISMA_SYNC_SCHEMA:-true}
      RUN_SEED: ${RUN_SEED:-false}
    volumes:
      - uploads:/app/uploads
      - audio_tmp:/app/tmp
      # Template photos and fonts used by DOCX/PDF export live in the frontend's public/ folder.
      - ${FRONTEND_DIR:-../../resume-builder-frontend}/public:/frontend/public:ro
    shm_size: "1gb"          # chromium needs more than the 64 MB default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging: *logging

  frontend:
    build:
      context: ${FRONTEND_DIR:-../../resume-builder-frontend}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:4000
        NEXT_PUBLIC_SITE_URL: ${APP_URL}
    image: resume-builder-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://backend:4000
      API_URL: http://backend:4000
      NEXT_PUBLIC_SITE_URL: ${APP_URL}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *logging

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SERVER_NAME: ${DOMAIN:-_}
    volumes:
      # NGINX_MODE=http (default) or https (after deploy.sh obtained a Let's Encrypt certificate).
      - ./nginx/templates/${NGINX_MODE:-http}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

  # One-shot helper for Let's Encrypt (deploy.sh --domain ... --email ...). Not started by "up".
  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  pgdata:
  redisdata:
  uploads:
  audio_tmp:
  certbot_www:
  letsencrypt:
